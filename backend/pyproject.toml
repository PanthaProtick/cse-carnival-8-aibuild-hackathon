[project]
name = "campusos-backend"
version = "0.1.0"
description = "CampusOS backend contracts and API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

